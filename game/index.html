<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Vault — a tiny stealth caper</title>
<style>
  html, body { margin: 0; padding: 0; background: #070912; min-height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; font-family: system-ui, "Segoe UI", sans-serif; color: #9aa5c7;
  }
  canvas {
    width: min(1024px, 96vw); height: auto; display: block;
    border: 1px solid #2c3557; border-radius: 6px; background: #101527;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
  }
  p { font-size: 13px; margin: 12px 0 18px; text-align: center; }
  b { color: #e8ecf8; }
  /* Screenshot mode (?shot=...): the frame is the game alone, edge to edge. */
  body.shot { justify-content: flex-start; }
  body.shot p { display: none; }
  body.shot canvas { border: none; border-radius: 0; box-shadow: none; }
</style>
<script>
  if (new URLSearchParams(location.search).has('shot')) document.addEventListener('DOMContentLoaded', () => document.body.classList.add('shot'));
</script>
</head>
<body>
<canvas id="game" width="1024" height="640"></canvas>
<p><b>Night Vault</b> — WASD / arrows to move · SHIFT to sneak · click or F to toss a coin · P pause · M mute · reach the green door unseen.</p>
<script type="module" src="src/main.js"></script>
</body>
</html>
